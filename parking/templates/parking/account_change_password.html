{% extends 'parking/base_dashboard.html' %}

{% block title %}تغییر رمز عبور{% endblock %}

{% block content %}
    <h1>تغییر رمز عبور</h1>

    <p>پارکینگ: {{ customer.name }}</p>
    <p>کاربر: {{ request.user.username }}</p>

    <hr>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">ذخیره رمز جدید</button>
    </form>

    <hr>

    <a href="{% url 'parking:dashboard' %}">بازگشت به داشبورد</a>
{% endblock %}
