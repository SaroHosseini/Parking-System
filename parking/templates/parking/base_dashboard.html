<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Parkino Dashboard{% endblock %}</title>
</head>
<body>
    <aside>
        <h2>Parkino</h2>

        <ul>
            <li><a href="{% url 'parking:dashboard' %}">داشبورد</a></li>
            <li><a href="{% url 'parking:parking_lot_list' %}">مدیریت پارکینگ‌ها</a></li>
            <li><a href="{% url 'parking:parking_spot_list' %}">مدیریت جایگاه‌ها</a></li>
            <li><a href="{% url 'parking:tariff_list' %}">مدیریت تعرفه‌ها</a></li>
            <li><a href="{% url 'parking:parking_session_list' %}">مدیریت سشن‌های پارک</a></li>
            <li><a href="{% url 'parking:payment_list' %}">مدیریت پرداخت‌ها</a></li>
            <li><a href="{% url 'parking:receipt_list' %}">مدیریت رسیدها</a></li>
        </ul>

        <form method="post" action="{% url 'parking:logout' %}">
            {% csrf_token %}
            <button type="submit">خروج</button>
        </form>
    </aside>

    <hr>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
